<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        h1 {
            font-size: 8vw;
            text-align: center;
        }

        p {
            font-size: 2vw;
            line-height: 1.6;
        }

        @media(max-width:600px) {
            h1 {
                font-size: 10vw;
            }

            p {
                font-size: 5vw;
            }
        }
    </style>
</head>
<body>

<h1>Responsive Typography</h1>

<p>
    The font size changes according to the screen width.
    Resize the browser to observe the difference.
</p>

</body>
</html>
