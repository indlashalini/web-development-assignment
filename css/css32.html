<!DOCTYPE html>
<html>
<head>
    <title>Shadows</title>
    <style>
        h1 {
            text-align: center;
            text-shadow: 3px 3px 5px gray;
        }

        .box {
            width: 300px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            box-shadow: 5px 5px 15px gray;
            text-align: center;
        }
    </style>
</head>
<body>

<h1>CSS Shadows</h1>

<div class="box">
    This box has a box-shadow.
</div>

</body>
</html>
