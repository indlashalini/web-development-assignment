<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #fff8f0;
        }

        header {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 35px;
        }

        nav {
            background: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
        }

        .hero {
            text-align: center;
            padding: 70px;
            background: #ffe4c4;
        }

        .menu {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 30px;
        }

        .item {
            width: 250px;
            background: white;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 8px gray;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        footer {
            background: #8b0000;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Delicious Bites</h1>
    <p>Fresh Food, Great Taste</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h1>Welcome to Delicious Bites</h1>
    <p>Enjoy our delicious dishes</p>
</section>

<h2 style="text-align:center;">Our Menu</h2>

<div class="menu">
    <div class="item">
        <h3>Pizza</h3>
        <p>Cheesy Italian Pizza</p>
        <p class="price">₹299</p>
    </div>

    <div class="item">
        <h3>Burger</h3>
        <p>Classic Veg Burger</p>
        <p class="price">₹149</p>
    </div>

    <div class="item">
        <h3>Pasta</h3>
        <p>Creamy White Sauce Pasta</p>
        <p class="price">₹249</p>
    </div>
</div>

<footer>
    © 2026 Delicious Bites
</footer>

</body>
</html>
