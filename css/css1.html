<!DOCTYPE html>
<html>
<head>
    <title>Inline Internal External CSS</title>

    <!-- Internal CSS -->
    <style>
        h2 {
            color: green;
            text-align: center;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Inline CSS -->
    <h1 style="color: red;">This is Inline CSS</h1>

    <!-- Internal CSS -->
    <h2>This is Internal CSS</h2>

    <!-- External CSS -->
    <p class="external">This is External CSS</p>

</body>
</html>
