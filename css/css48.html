<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>
    <style>
        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px;
        }

        aside {
            background: lightblue;
            padding: 30px;
        }

        main {
            background: lightgreen;
            padding: 30px;
        }

        @media(max-width:600px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>Two-Column Layout</h1>

<div class="layout">
    <aside>
        <h2>Sidebar</h2>
        <p>Menu items</p>
    </aside>

    <main>
        <h2>Main Content</h2>
        <p>This is the main webpage content.</p>
    </main>
</div>

</body>
</html>
