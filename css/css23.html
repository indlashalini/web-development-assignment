<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .card {
            width: 280px;
            margin: 50px auto;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background: navy;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://via.placeholder.com/280x180" alt="Product">
    <div class="card-content">
        <h2>Smart Watch</h2>
        <p>Stylish and modern smartwatch.</p>
        <p class="price">₹2,999</p>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
