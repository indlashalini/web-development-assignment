<!DOCTYPE html>
<html>
<head>
    <title>Image Hover Effect</title>
    <style>
        .image-box {
            width: 350px;
            margin: 50px auto;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            transition: transform 0.5s;
        }

        .image-box img:hover {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

<h1>Image Hover Effect</h1>

<div class="image-box">
    <img src="https://picsum.photos/350/250">
</div>

</body>
</html>
