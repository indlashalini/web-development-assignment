<!DOCTYPE html>
<html>
<head>
    <title>Website Homepage</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 20px;
            text-decoration: none;
        }

        .hero {
            background: lightblue;
            padding: 80px 20px;
            text-align: center;
        }

        .hero button {
            padding: 12px 25px;
            background: navy;
            color: white;
            border: none;
        }

        .sections {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .section {
            flex: 1;
            padding: 30px;
            background: #f1f1f1;
            text-align: center;
        }

        footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:600px) {
            .sections {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>My Website</h1>
    <p>Welcome to our homepage</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<section class="hero">
    <h1>Welcome to Our Website</h1>
    <p>Learn, Explore and Grow</p>
    <button>Get Started</button>
</section>

<div class="sections">
    <div class="section">
        <h2>About Us</h2>
        <p>We provide quality services.</p>
    </div>

    <div class="section">
        <h2>Our Services</h2>
        <p>Web design and development.</p>
    </div>

    <div class="section">
        <h2>Contact</h2>
        <p>Reach us anytime.</p>
    </div>
</div>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
