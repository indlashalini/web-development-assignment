<!DOCTYPE html>
<html>
<head>
    <title>Opacity</title>
    <style>
        .box1 {
            background: red;
            opacity: 1;
            padding: 30px;
            margin: 10px;
        }

        .box2 {
            background: red;
            opacity: 0.5;
            padding: 30px;
            margin: 10px;
        }

        .transparent {
            background: rgba(0, 0, 255, 0.4);
            padding: 30px;
            margin: 10px;
        }
    </style>
</head>
<body>

<h1>Opacity and Transparency</h1>

<div class="box1">Opacity 1</div>
<div class="box2">Opacity 0.5</div>
<div class="transparent">RGBA Transparency</div>

</body>
</html>
