<!DOCTYPE html>
<html>
<head>
    <title>Display Properties</title>
    <style>
        .block {
            display: block;
            background: lightblue;
            padding: 15px;
        }

        .inline {
            display: inline;
            background: yellow;
            padding: 15px;
        }

        .inline-block {
            display: inline-block;
            background: lightgreen;
            padding: 20px;
            margin: 10px;
        }

        .none {
            display: none;
        }
    </style>
</head>
<body>

<h1>CSS Display Properties</h1>

<div class="block">Block Element</div>

<span class="inline">Inline Element</span>

<div class="inline-block">Inline-Block Element</div>

<p class="none">This element is hidden using display:none.</p>

</body>
</html>
