<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Cards</title>
    <style>
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1 1 250px;
            max-width: 300px;
            background: lightblue;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<h1>Flexbox Card Layout</h1>

<div class="cards">
    <div class="card"><h2>HTML</h2><p>Structure</p></div>
    <div class="card"><h2>CSS</h2><p>Styling</p></div>
    <div class="card"><h2>JavaScript</h2><p>Behavior</p></div>
</div>

</body>
</html>
