<!DOCTYPE html>
<html>
<head>
    <title>CSS Tooltip</title>
    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 100px;
            background: navy;
            color: white;
            padding: 15px;
        }

        .tooltip-text {
            visibility: hidden;
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 8px;
            width: 150px;
            text-align: center;
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
        }
    </style>
</head>
<body>

<h1>CSS Tooltip</h1>

<div class="tooltip">
    Hover over me
    <span class="tooltip-text">This is a tooltip message!</span>
</div>

</body>
</html>
