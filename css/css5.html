<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 250px;
            background-color: lightblue;

            /* Content */
            padding: 30px;

            /* Border */
            border: 5px solid navy;

            /* Margin */
            margin: 50px auto;

            text-align: center;
        }
    </style>
</head>
<body>

    <h1 style="text-align:center;">CSS Box Model</h1>

    <div class="box">
        Content Area
        <br><br>
        Padding surrounds the content.
        <br>
        Border surrounds padding.
        <br>
        Margin surrounds the border.
    </div>

</body>
</html>
