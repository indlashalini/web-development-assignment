<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
        }

        header {
            background: #2874f0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .product {
            width: 250px;
            background: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 8px #ccc;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            background: #2874f0;
            color: white;
            border: none;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>ShopEasy</h1>
    <p>Your Online Shopping Store</p>
</header>

<div class="products">

    <div class="product">
        <img src="https://picsum.photos/250/180?1">
        <h3>Smartphone</h3>
        <p class="price">₹15,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/250/180?2">
        <h3>Headphones</h3>
        <p class="price">₹1,999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://picsum.photos/250/180?3">
        <h3>Laptop</h3>
        <p class="price">₹55,999</p>
        <button>Add to Cart</button>
    </div>

</div>

</body>
</html>
