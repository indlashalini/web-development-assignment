<!DOCTYPE html>
<html>
<head>
    <title>Three Column Flexbox</title>
    <style>
        .columns {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .column {
            flex: 1;
            background: lightblue;
            padding: 30px;
            text-align: center;
        }

        @media(max-width:600px) {
            .columns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<h1>Three-Column Layout</h1>

<div class="columns">
    <div class="column">Column 1</div>
    <div class="column">Column 2</div>
    <div class="column">Column 3</div>
</div>

</body>
</html>
