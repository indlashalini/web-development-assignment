<!DOCTYPE html>
<html>
<head>
    <title>Responsive Login Signup</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #667eea, #764ba2);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: white;
            width: 400px;
            max-width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            color: navy;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: navy;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: green;
        }

        .signup {
            text-align: center;
            margin-top: 15px;
        }

        .signup a {
            color: blue;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="box">
        <h2>Login</h2>

        <form>
            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">
            <button type="submit">Login</button>
        </form>

        <div class="signup">
            New user? <a href="#">Sign Up</a>
        </div>
    </div>
</div>

</body>
</html>
