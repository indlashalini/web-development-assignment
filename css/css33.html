<!DOCTYPE html>
<html>
<head>
    <title>Border Radius</title>
    <style>
        .square {
            width: 150px;
            height: 150px;
            background: lightblue;
            border-radius: 20px;
            margin: 20px;
            display: inline-block;
        }

        .circle {
            width: 150px;
            height: 150px;
            background: orange;
            border-radius: 50%;
            margin: 20px;
            display: inline-block;
        }

        .pill {
            width: 250px;
            height: 80px;
            background: green;
            border-radius: 50px;
            display: inline-block;
            margin: 20px;
        }
    </style>
</head>
<body>

<h1>Border Radius Shapes</h1>

<div class="square"></div>
<div class="circle"></div>
<div class="pill"></div>

</body>
</html>
