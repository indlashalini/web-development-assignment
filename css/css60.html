<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: navy;
            color: white;
            text-align: center;
            padding: 60px;
        }

        nav {
            background: #222;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        section {
            padding: 40px;
            text-align: center;
        }

        .skills, .projects {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: lightblue;
            padding: 25px;
            width: 220px;
        }

        footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Portfolio</h1>
    <p>Web Developer & Programmer</p>
</header>

<nav>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
</nav>

<section id="about">
    <h2>About Me</h2>
    <p>I am a passionate student interested in web development.</p>
</section>

<section id="skills">
    <h2>Skills</h2>

    <div class="skills">
        <div class="card">HTML</div>
        <div class="card">CSS</div>
        <div class="card">Python</div>
    </div>
</section>

<section id="projects">
    <h2>Projects</h2>

    <div class="projects">
        <div class="card">Portfolio Website</div>
        <div class="card">Student Data Analysis</div>
        <div class="card">Registration System</div>
    </div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <p>Email: example@email.com</p>
</section>

<footer>
    © 2026 My Portfolio
</footer>

</body>
</html>
