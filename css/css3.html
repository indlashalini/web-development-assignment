<!DOCTYPE html>
<html>
<head>
    <title>Colors Backgrounds Borders</title>

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        .box {
            background-color: lightblue;
            border: 4px solid navy;
            padding: 20px;
            margin: 20px;
        }

        .box2 {
            background-image: linear-gradient(to right, pink, orange);
            border: 3px dashed red;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Colors, Backgrounds and Borders</h1>

    <div class="box">
        This box demonstrates background color and solid border.
    </div>

    <div class="box2">
        This box demonstrates gradient background and dashed border.
    </div>

</body>
</html>
