<!DOCTYPE html>
<html>
<head>
    <title>Font Properties</title>

    <style>
        h1 {
            font-family: Arial;
            font-size: 36px;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            color: darkblue;
        }

        p {
            font-family: Georgia;
            font-size: 20px;
            line-height: 1.8;
            letter-spacing: 2px;
            text-transform: capitalize;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Font Properties</h1>

    <p>
        This paragraph demonstrates different font properties
        and text formatting using CSS.
    </p>

</body>
</html>
