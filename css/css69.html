<!DOCTYPE html>
<html>
<head>
    <title>Sliding Image Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .container {
            width: 300px;
            margin: 50px auto;
            overflow: hidden;
            border: 2px solid black;
        }

        .slider {
            display: flex;
            width: 1500px;
            animation: slide 10s infinite;
        }

        .slider img {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }

        @keyframes slide {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-300px);
            }

            45% {
                transform: translateX(-300px);
            }

            50% {
                transform: translateX(-600px);
            }

            70% {
                transform: translateX(-600px);
            }

            75% {
                transform: translateX(-900px);
            }

            95% {
                transform: translateX(-900px);
            }

            100% {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <h1>Sliding Image Animation</h1>

    <div class="container">
        <div class="slider">
            <img src="../assets/image/image1.jpg" alt="Image 1">
            <img src="../assets/image/image2.jpg" alt="Image 2">
            <img src="../assets/image/image3.jpg" alt="Image 3">
            <img src="../assets/image/image4.jpg" alt="Image 4">
            <img src="../assets/image/image5.jpg" alt="Image 5">
        </div>
    </div>

</body>
</html>
