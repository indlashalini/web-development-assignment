<!DOCTYPE html>
<html>
<head>
    <title>Width Height Sizing</title>

    <style>
        .fixed {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            margin: 10px;
            padding: 10px;
        }

        .percentage {
            width: 70%;
            height: 100px;
            background-color: lightgreen;
            margin: 10px;
        }

        .maxbox {
            width: 90%;
            max-width: 500px;
            min-height: 100px;
            background-color: pink;
            margin: 10px;
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>CSS Width, Height and Sizing</h1>

    <div class="fixed">
        Fixed Width: 300px
    </div>

    <div class="percentage">
        Percentage Width: 70%
    </div>

    <div class="maxbox">
        Maximum Width and Minimum Height
    </div>

</body>
</html>
