<!DOCTYPE html>
<html>
<head>
    <title>CSS Modal Popup</title>

    <style>
        .open-btn {
            padding: 15px 25px;
            background: navy;
            color: white;
            text-decoration: none;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
        }

        .modal:target {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 10px;
        }

        .close {
            display: inline-block;
            margin-top: 15px;
            color: red;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h1>CSS-Only Modal</h1>

<a href="#popup" class="open-btn">Open Popup</a>

<div id="popup" class="modal">
    <div class="modal-content">
        <h2>Welcome!</h2>
        <p>This is a CSS-only popup modal.</p>
        <a href="#" class="close">Close</a>
    </div>
</div>

</body>
</html>
