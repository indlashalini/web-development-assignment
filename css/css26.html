<!DOCTYPE html>
<html>
<head>
    <title>Inheritance and Specificity</title>
    <style>
        body {
            color: blue;
            font-family: Arial;
        }

        p {
            color: green;
        }

        .text {
            color: orange;
        }

        #special {
            color: red;
        }

        .box {
            color: purple;
        }
    </style>
</head>
<body>

<h1>CSS Inheritance and Specificity</h1>

<div class="box">
    <p>This paragraph inherits font-family from body.</p>
    <p class="text">Class selector overrides element selector.</p>
    <p id="special" class="text">ID selector has higher specificity.</p>
</div>

</body>
</html>
