<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment and Ordering</title>

    <style>
        .container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            height: 300px;
            background: lightgray;
            gap: 15px;
        }

        .box {
            padding: 30px;
            background: steelblue;
            color: white;
        }

        .box1 {
            order: 3;
        }

        .box2 {
            order: 1;
        }

        .box3 {
            order: 2;
        }
    </style>
</head>
<body>

<h1>Flexbox Alignment and Ordering</h1>

<div class="container">
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
    <div class="box box3">Box 3</div>
</div>

</body>
</html>
