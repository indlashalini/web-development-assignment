<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>
    <style>
        * {
            font-family: Arial;
        }

        p {
            color: blue;
        }

        .highlight {
            background: yellow;
        }

        #unique {
            color: red;
        }

        input[type="text"] {
            border: 2px solid green;
        }

        h1, h2 {
            text-align: center;
            color: navy;
        }
    </style>
</head>
<body>

<h1>CSS Selectors</h1>
<h2>Grouping Selector</h2>

<p>Element selector</p>
<p class="highlight">Class selector</p>
<p id="unique">ID selector</p>

<input type="text" placeholder="Attribute selector">

</body>
</html>
