<!DOCTYPE html>
<html>
<head>
    <title>CSS Gradients</title>
    <style>
        .linear {
            height: 150px;
            background: linear-gradient(to right, red, yellow, green);
            padding: 20px;
        }

        .radial {
            height: 150px;
            background: radial-gradient(circle, blue, purple, black);
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>

<h1>CSS Gradients</h1>

<div class="linear">Linear Gradient</div>
<br>
<div class="radial">Radial Gradient</div>

</body>
</html>
