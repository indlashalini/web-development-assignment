<!DOCTYPE html>
<html>
<head>
    <title>Button Hover Animation</title>
    <style>
        .btn {
            padding: 15px 30px;
            background: navy;
            color: white;
            border: none;
            border-radius: 5px;
            transition: all 0.4s;
            cursor: pointer;
        }

        .btn:hover {
            background: orange;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px gray;
        }
    </style>
</head>
<body>

<h1>Button Hover Animation</h1>

<button class="btn">Hover Me</button>

</body>
</html>
