<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Grid</title>
    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            min-height: 500px;
        }

        header {
            grid-column: 1 / 3;
            background: navy;
            color: white;
            padding: 20px;
        }

        aside {
            background: #ddd;
            padding: 20px;
        }

        main {
            padding: 20px;
            background: #f5f5f5;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: lightblue;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>Admin Dashboard</header>

    <aside>
        <p>Home</p>
        <p>Users</p>
        <p>Reports</p>
    </aside>

    <main>
        <h2>Dashboard Overview</h2>

        <div class="cards">
            <div class="card">Users: 120</div>
            <div class="card">Orders: 80</div>
            <div class="card">Revenue: ₹50K</div>
        </div>
    </main>
</div>

</body>
</html>
