<!DOCTYPE html>
<html>
<head>
    <title>Grid Template Areas</title>

    <style>
        .layout {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 1fr 60px;
            min-height: 500px;
        }

        header {
            grid-area: header;
            background: navy;
            color: white;
            padding: 20px;
        }

        aside {
            grid-area: sidebar;
            background: lightgray;
            padding: 20px;
        }

        main {
            grid-area: main;
            background: lightblue;
            padding: 20px;
        }

        footer {
            grid-area: footer;
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:600px) {
            .layout {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";

                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="layout">
    <header>Website Header</header>
    <aside>Sidebar Menu</aside>
    <main>Main Content</main>
    <footer>Website Footer</footer>
</div>

</body>
</html>
