<!DOCTYPE html>
<html>
<head>
    <title>CSS Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
            background-color: lightblue;
            padding: 20px;
        }

        ol {
            list-style-type: upper-roman;
            background-color: lightgreen;
            padding: 20px;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: navy;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: yellow;
        }
    </style>
</head>
<body>

    <h1>CSS Lists and Tables</h1>

    <h2>Unordered List</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Login</li>
        <li>Register</li>
        <li>Logout</li>
    </ol>

    <h2>Student Table</h2>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Shalini</td>
            <td>B.Tech</td>
            <td>90</td>
        </tr>
        <tr>
            <td>Priya</td>
            <td>B.Tech</td>
            <td>85</td>
        </tr>
    </table>

</body>
</html>
