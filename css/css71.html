<!DOCTYPE html>
<html>
<head>
    <title>Dark Mode</title>

    <style>
        :root {
            --bg-color: white;
            --text-color: black;
            --card-color: #f2f2f2;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: Arial;
            padding: 30px;
        }

        .card {
            background: var(--card-color);
            padding: 30px;
            margin: 20px 0;
        }

        @media(prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: white;
                --card-color: #333;
            }
        }
    </style>
</head>
<body>

<h1>Dark Mode Webpage</h1>

<div class="card">
    <h2>CSS Variables</h2>
    <p>This page automatically adapts to the system color scheme.</p>
</div>

</body>
</html>
