<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>

    <style>
        nav {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 18px;
        }

        nav a:hover {
            background-color: orange;
            color: black;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Styled Navigation Bar</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

</body>
</html>
