<!DOCTYPE html>
<html>
<head>
    <title>Visibility</title>
    <style>
        .visible {
            background: lightgreen;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background: red;
            padding: 20px;
        }

        .none {
            display: none;
            background: blue;
            padding: 20px;
        }
    </style>
</head>
<body>

<h1>Visibility and Hiding</h1>

<div class="visible">Visible Element</div>
<div class="hidden">Hidden using visibility:hidden</div>
<div class="none">Hidden using display:none</div>

<p>The hidden element still occupies space, but display:none does not.</p>

</body>
</html>
