<!DOCTYPE html>
<html>
<head>
    <title>Sticky Header</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            position: sticky;
            top: 0;
            background: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        section {
            height: 300px;
            padding: 30px;
        }
    </style>
</head>
<body>

<header>
    Sticky Header
</header>

<section style="background:lightblue;">Section 1</section>
<section style="background:lightgreen;">Section 2</section>
<section style="background:pink;">Section 3</section>
<section style="background:orange;">Section 4</section>

</body>
</html>
