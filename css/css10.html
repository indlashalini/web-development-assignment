<!DOCTYPE html>
<html>
<head>
    <title>CSS Pseudo Classes</title>

    <style>
        /* Hover */
        a:hover {
            color: red;
            background-color: yellow;
        }

        /* Active */
        a:active {
            color: green;
        }

        /* Visited */
        a:visited {
            color: purple;
        }

        /* Focus */
        input:focus {
            background-color: lightblue;
            border: 3px solid blue;
        }

        button:hover {
            background-color: orange;
        }
    </style>
</head>
<body>

    <h1>CSS Pseudo-Classes</h1>

    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <br><br>

    <input type="text" placeholder="Click and type here">

    <br><br>

    <button>Hover Over Me</button>

</body>
</html>
