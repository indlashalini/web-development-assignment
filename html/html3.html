<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <h1>Student Marks Table</h1>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th rowspan="2">Student Name</th>
            <th colspan="3">Marks</th>
        </tr>

        <tr>
            <th>Maths</th>
            <th>Science</th>
            <th>English</th>
        </tr>

        <tr>
            <td>Shalini</td>
            <td>90</td>
            <td>85</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>80</td>
            <td>82</td>
            <td>79</td>
        </tr>

        <tr>
            <td colspan="3">Total Students</td>
            <td>2</td>
        </tr>
    </table>

</body>
</html>
