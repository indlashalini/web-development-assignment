<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        /* Element Selector */
        h1 {
            color: navy;
            text-align: center;
        }

        /* Class Selector */
        .description {
            color: green;
            font-size: 18px;
            font-family: Arial;
        }

        /* ID Selector */
        #special {
            color: red;
            font-weight: bold;
        }

        .box {
            background-color: lightblue;
            border: 3px solid blue;
            margin: 30px;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>CSS Selectors and Properties</h1>

    <p class="description">
        This paragraph uses a class selector.
    </p>

    <p id="special">
        This paragraph uses an ID selector.
    </p>

    <div class="box">
        This box demonstrates margin, padding, border, and colors.
    </div>

</body>
</html>
