<!DOCTYPE html>
<html>
<body>
<h2>Fibonacci Series</h2>
<script>
    let n = Number(prompt("Enter number of terms:"));
    let a = 0, b = 1;

    document.write("Fibonacci Series: ");
    for (let i = 0; i < n; i++) {
        document.write(a + " ");
        let next = a + b;
        a = b;
        b = next;
    }
</script>
</body>
</html>
