<!DOCTYPE html>
<html>
<body>
<h2>Perfect Number</h2>
<script>
    let num = Number(prompt("Enter a number:"));
    let sum = 0;

    for (let i = 1; i < num; i++) {
        if (num % i === 0) sum += i;
    }

    document.write(sum === num
        ? "Perfect Number"
        : "Not a Perfect Number");
</script>
</body>
</html>
