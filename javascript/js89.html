<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Game</title>
    <style>
        #game {
            width: 500px;
            height: 300px;
            border: 2px solid black;
            position: relative;
        }

        #player {
            width: 40px;
            height: 40px;
            background-color: red;
            position: absolute;
            left: 0;
            top: 0;
        }
    </style>
</head>
<body>

<h2>Keyboard-Controlled Game</h2>
<p>Use Arrow Keys to move the red box.</p>

<div id="game">
    <div id="player"></div>
</div>

<script>
const player = document.getElementById("player");

let x = 0;
let y = 0;

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") x += 10;
    if (event.key === "ArrowLeft") x -= 10;
    if (event.key === "ArrowDown") y += 10;
    if (event.key === "ArrowUp") y -= 10;

    x = Math.max(0, Math.min(460, x));
    y = Math.max(0, Math.min(260, y));

    player.style.left = x + "px";
    player.style.top = y + "px";
});
</script>

</body>
</html>
