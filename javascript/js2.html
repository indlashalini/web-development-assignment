<!DOCTYPE html>
<html>
<body>
<h2>Arithmetic Operations</h2>
<script>
    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));

    document.write("Addition: " + (a + b) + "<br>");
    document.write("Subtraction: " + (a - b) + "<br>");
    document.write("Multiplication: " + (a * b) + "<br>");
    document.write("Division: " + (b !== 0 ? a / b : "Cannot divide by zero") + "<br>");
    document.write("Modulus: " + (b !== 0 ? a % b : "Cannot divide by zero"));
</script>
</body>
</html>
