<!DOCTYPE html>
<html>
<body>
<h2>Student Object</h2>
<script>
    let student = {
        name: prompt("Enter student name:"),
        age: Number(prompt("Enter student age:")),
        course: prompt("Enter course:")
    };

    document.write("Name: " + student.name + "<br>");
    document.write("Age: " + student.age + "<br>");
    document.write("Course: " + student.course);
</script>
</body>
</html>
