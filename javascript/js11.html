<!DOCTYPE html>
<html>
<body>
<h2>Sum of Digits</h2>
<script>
    let num = Math.abs(Number(prompt("Enter a number:")));
    let sum = 0;

    while (num > 0) {
        sum += num % 10;
        num = Math.floor(num / 10);
    }

    document.write("Sum of digits: " + sum);
</script>
</body>
</html>
