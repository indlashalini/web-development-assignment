<!DOCTYPE html>
<html>
<body>

<input type="text" id="search" placeholder="Search name..." onkeyup="searchTable()">

<table border="1" id="table">
    <tr>
        <th>Name</th>
        <th>Course</th>
    </tr>
    <tr><td>Shalini</td><td>B.Tech</td></tr>
    <tr><td>Rahul</td><td>BCA</td></tr>
    <tr><td>Anu</td><td>B.Sc</td></tr>
</table>

<script>
function searchTable() {
    let input = document.getElementById("search").value.toLowerCase();
    let rows = document.getElementById("table").rows;

    for (let i = 1; i < rows.length; i++) {
        let name = rows[i].cells[0].textContent.toLowerCase();

        rows[i].style.display = name.includes(input) ? "" : "none";
    }
}
</script>

</body>
</html>
