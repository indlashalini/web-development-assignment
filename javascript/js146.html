<!DOCTYPE html>
<html>
<body>

<input type="password" id="password">
<button onclick="togglePassword()">Show/Hide</button>

<script>
function togglePassword() {
    let password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

</body>
</html>
