<!DOCTYPE html>
<html>
<body>

<h2 onmouseover="mouseOver()" onmouseout="mouseOut()" id="text">
    Move Mouse Over Me
</h2>

<script>
function mouseOver() {
    document.getElementById("text").innerHTML = "Mouse is Over!";
}

function mouseOut() {
    document.getElementById("text").innerHTML = "Mouse is Out!";
}
</script>

</body>
</html>
