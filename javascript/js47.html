<!DOCTYPE html>
<html>
<head>
    <title>Interactive Webpage</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 0;
        }

        header {
            background: navy;
            color: white;
            padding: 20px;
        }

        section {
            padding: 30px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .dark {
            background: #222;
            color: white;
        }
    </style>
</head>
<body>

<header>
    <h1>My Interactive Website</h1>
</header>

<section>
    <h2 id="heading">Welcome to My Website</h2>
    <p>This webpage uses HTML, CSS, and JavaScript.</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="toggleTheme()">Toggle Theme</button>
</section>

<script>
    function changeText() {
        document.getElementById("heading").innerHTML =
            "You clicked the button!";
    }

    function toggleTheme() {
        document.body.classList.toggle("dark");
    }
</script>

</body>
</html>
