<!DOCTYPE html>
<html>
<head>
    <title>Double Click Event</title>
    <style>
        #box {
            width: 250px;
            height: 150px;
            background-color: lightblue;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Double-Click Demonstration</h2>

<div id="box">Double-click me</div>
<p id="message"></p>

<script>
document.getElementById("box").addEventListener("dblclick", function() {
    this.style.backgroundColor = "lightgreen";
    this.textContent = "Double-click detected!";
    document.getElementById("message").textContent =
        "The box changed after double-clicking.";
});
</script>

</body>
</html>
