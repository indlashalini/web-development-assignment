<!DOCTYPE html>
<html>
<body>
<h2>String Operations</h2>
<script>
    let str = prompt("Enter a string:");

    document.write("Original: " + str + "<br>");
    document.write("Length: " + str.length + "<br>");
    document.write("Uppercase: " + str.toUpperCase() + "<br>");
    document.write("Lowercase: " + str.toLowerCase() + "<br>");
    document.write("First Character: " + str.charAt(0) + "<br>");
    document.write("Includes 'Java': " + str.includes("Java"));
</script>
</body>
</html>
