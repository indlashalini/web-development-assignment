<!DOCTYPE html>
<html>
<body>
<h2>Power of a Number</h2>
<script>
    let base = Number(prompt("Enter base:"));
    let exponent = Number(prompt("Enter exponent:"));

    let result = Math.pow(base, exponent);

    document.write(base + " raised to " + exponent + " = " + result);
</script>
</body>
</html>
