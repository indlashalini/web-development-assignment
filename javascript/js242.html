<!DOCTYPE html>
<html>
<head>
    <title>Screen Information</title>
</head>
<body>

<h2>Screen Information</h2>

<p id="screen"></p>

<script>
document.getElementById("screen").innerHTML =
    "Screen Width: " + screen.width + " pixels<br>" +
    "Screen Height: " + screen.height + " pixels";
</script>

</body>
</html>
