<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h2>Shopping Cart using localStorage</h2>

    <button onclick="addItem('Laptop')">Add Laptop</button>
    <button onclick="addItem('Mouse')">Add Mouse</button>
    <button onclick="addItem('Keyboard')">Add Keyboard</button>

    <h3>Cart Items:</h3>
    <ul id="cart"></ul>

    <button onclick="clearCart()">Clear Cart</button>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem("cart")) || [];
        }

        function addItem(item) {
            let cart = getCart();
            cart.push(item);
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function displayCart() {
            let cart = getCart();
            document.getElementById("cart").innerHTML =
                cart.map(item => `<li>${item}</li>`).join("");
        }

        function clearCart() {
            localStorage.removeItem("cart");
            displayCart();
        }

        displayCart();
    </script>
</body>
</html>
