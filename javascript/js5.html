<!DOCTYPE html>
<html>
<body>
<h2>Positive, Negative or Zero</h2>
<script>
    let num = Number(prompt("Enter a number:"));
    if (num > 0) {
        document.write("Positive number");
    } else if (num < 0) {
        document.write("Negative number");
    } else {
        document.write("Zero");
    }
</script>
</body>
</html>
