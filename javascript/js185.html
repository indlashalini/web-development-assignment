<!DOCTYPE html>
<html>
<body>

<h2>Double Clicks: <span id="count">0</span></h2>

<button id="btn">Double Click Me</button>

<script>
let count = 0;

document.getElementById("btn").addEventListener("dblclick", function() {

    count++;

    document.getElementById("count").innerHTML = count;

});
</script>

</body>
</html>
