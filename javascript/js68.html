<!DOCTYPE html>
<html>
<head>
    <title>Add Elements Dynamically</title>
</head>
<body>
    <h2>Add New Elements</h2>

    <button onclick="addElement()">Add Paragraph</button>
    <div id="container"></div>

    <script>
        function addElement() {
            let p = document.createElement("p");
            p.textContent = "This paragraph was created dynamically!";
            document.getElementById("container").appendChild(p);
        }
    </script>
</body>
</html>
