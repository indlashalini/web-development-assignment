<!DOCTYPE html>
<html>
<body>
    <h2>User List</h2>
    <ul id="userList"></ul>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(response => response.json())
            .then(users => {
                let list = document.getElementById("userList");

                users.forEach(user => {
                    let li = document.createElement("li");
                    li.innerHTML = user.name + " - " + user.email;
                    list.appendChild(li);
                });
            });
    </script>
</body>
</html>
