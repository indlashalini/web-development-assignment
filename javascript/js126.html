<!DOCTYPE html>
<html>
<body>

<div id="box" style="width:200px;height:100px;border:1px solid black;">
    Color Box
</div>

<button onclick="changeColor()">Change Background</button>

<script>
function changeColor() {
    document.getElementById("box").style.backgroundColor = "lightgreen";
}
</script>

</body>
</html>
