<!DOCTYPE html>
<html>
<body>

<h2>Page 1</h2>

<input id="name" placeholder="Enter name">

<br><br>

<button onclick="nextPage()">Next</button>

<script>

function nextPage() {

    sessionStorage.setItem(
        "name",
        document.getElementById("name").value
    );

    window.location.href = "page2.html";
}

</script>

</body>
</html>
