<!DOCTYPE html>
<html>
<head>
<style>
.dark {
    background-color: black;
    color: white;
    padding: 20px;
}
</style>
</head>
<body>

<div id="box">Toggle My Style</div>
<button onclick="toggleStyle()">Toggle Class</button>

<script>
function toggleStyle() {
    document.getElementById("box").classList.toggle("dark");
}
</script>

</body>
</html>
