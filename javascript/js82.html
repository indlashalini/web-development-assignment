<!DOCTYPE html>
<html>
<head>
    <title>Image Slideshow</title>

    <style>
        img {
            width: 400px;
            height: 250px;
            object-fit: cover;
            display: block;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h2>Image Slideshow</h2>

    <img id="slide" src="https://picsum.photos/id/1015/400/250">

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

    <script>
        let images = [
            "https://picsum.photos/id/1015/400/250",
            "https://picsum.photos/id/1016/400/250",
            "https://picsum.photos/id/1018/400/250",
            "https://picsum.photos/id/1020/400/250"
        ];

        let index = 0;

        function showImage() {
            document.getElementById("slide").src = images[index];
        }

        function next() {
            index++;

            if (index >= images.length) {
                index = 0;
            }

            showImage();
        }

        function previous() {
            index--;

            if (index < 0) {
                index = images.length - 1;
            }

            showImage();
        }

        // Automatically change image every 3 seconds
        setInterval(next, 3000);
    </script>
</body>
</html>
