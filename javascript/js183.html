<!DOCTYPE html>
<html>
<head>

<style>
#box {
    width: 50px;
    height: 50px;
    background-color: red;
    position: absolute;
    left: 100px;
    top: 100px;
}
</style>

</head>

<body>

<div id="box"></div>

<script>
let box = document.getElementById("box");

let x = 100;
let y = 100;

document.addEventListener("keydown", function(event) {

    if (event.key === "ArrowRight") {
        x += 10;
    }

    if (event.key === "ArrowLeft") {
        x -= 10;
    }

    if (event.key === "ArrowUp") {
        y -= 10;
    }

    if (event.key === "ArrowDown") {
        y += 10;
    }

    box.style.left = x + "px";
    box.style.top = y + "px";
});
</script>

</body>
</html>
