<!DOCTYPE html>
<html>
<head>
    <title>Tic-Tac-Toe</title>

    <style>
        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
        }

        button {
            width: 80px;
            height: 80px;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h2>Tic-Tac-Toe</h2>

    <div class="board">
        <button onclick="play(0)"></button>
        <button onclick="play(1)"></button>
        <button onclick="play(2)"></button>
        <button onclick="play(3)"></button>
        <button onclick="play(4)"></button>
        <button onclick="play(5)"></button>
        <button onclick="play(6)"></button>
        <button onclick="play(7)"></button>
        <button onclick="play(8)"></button>
    </div>

    <p id="message"></p>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let player = "X";
        let buttons = document.querySelectorAll(".board button");

        function play(index) {
            if (board[index] !== "") return;

            board[index] = player;
            buttons[index].innerHTML = player;

            if (checkWinner()) {
                document.getElementById("message").innerHTML =
                    player + " Wins!";
                return;
            }

            player = player === "X" ? "O" : "X";
        }

        function checkWinner() {
            let wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];

            return wins.some(pattern =>
                board[pattern[0]] &&
                board[pattern[0]] === board[pattern[1]] &&
                board[pattern[1]] === board[pattern[2]]
            );
        }
    </script>
</body>
</html>
