<!DOCTYPE html>
<html>
<body>

<button 
    onmousedown="mouseDown()" 
    onmouseup="mouseUp()">
    Press Me
</button>

<p id="message"></p>

<script>
function mouseDown() {
    document.getElementById("message").innerHTML = "Mouse Button Pressed";
}

function mouseUp() {
    document.getElementById("message").innerHTML = "Mouse Button Released";
}
</script>

</body>
</html>
