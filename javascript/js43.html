<!DOCTYPE html>
<html>
<body>
    <h2>Fetch API Example</h2>
    <p id="output">Loading...</p>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users/1")
            .then(response => response.json())
            .then(data => {
                document.getElementById("output").innerHTML =
                    "Name: " + data.name;
            })
            .catch(error => {
                document.getElementById("output").innerHTML =
                    "Error fetching data";
            });
    </script>
</body>
</html>
