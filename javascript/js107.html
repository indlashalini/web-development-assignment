<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>
    <h2>Digital Clock</h2>

    <h1 id="clock"></h1>

    <script>
        function updateClock() {
            let now = new Date();

            document.getElementById("clock").innerHTML =
                now.toLocaleTimeString();
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
