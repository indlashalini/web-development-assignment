<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>
<body>

<h2>Browser History</h2>

<button onclick="goBack()">Back</button>
<button onclick="goForward()">Forward</button>

<script>
function goBack() {
    history.back();
}

function goForward() {
    history.forward();
}
</script>

</body>
</html>
