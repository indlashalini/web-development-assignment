<!DOCTYPE html>
<html>
<body>

<select id="course">
    <option>Select Course</option>
    <option>Python</option>
    <option>JavaScript</option>
    <option>Java</option>
</select>

<p id="result"></p>

<script>
document.getElementById("course").addEventListener("change", function() {
    document.getElementById("result").innerHTML =
        "Selected: " + this.value;
});
</script>

</body>
</html>
