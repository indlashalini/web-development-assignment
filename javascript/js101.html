<!DOCTYPE html>
<html>
<head>
    <title>History Object</title>
</head>
<body>
    <h2>History Object Demonstration</h2>

    <button onclick="goBack()">Go Back</button>
    <button onclick="goForward()">Go Forward</button>

    <script>
        function goBack() {
            history.back();
        }

        function goForward() {
            history.forward();
        }
    </script>
</body>
</html>
