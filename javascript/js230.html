<!DOCTYPE html>
<html>
<head>
    <title>setTimeout</title>
</head>
<body>

<h2>setTimeout() Example</h2>

<button onclick="startTimer()">Start</button>

<p id="output"></p>

<script>
function startTimer() {
    document.getElementById("output").innerHTML =
        "Please wait...";

    setTimeout(function() {
        document.getElementById("output").innerHTML =
            "3 seconds completed!";
    }, 3000);
}
</script>

</body>
</html>
