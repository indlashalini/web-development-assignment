<!DOCTYPE html>
<html>
<body>

<h2>Shopping Cart</h2>

<button onclick="addProduct('Laptop')">Add Laptop</button>
<button onclick="addProduct('Mouse')">Add Mouse</button>
<button onclick="addProduct('Keyboard')">Add Keyboard</button>

<h3>Cart</h3>

<ul id="cart"></ul>

<script>

function addProduct(product) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart.push(product);

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

function displayCart() {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let output = "";

    cart.forEach(function(item) {
        output += "<li>" + item + "</li>";
    });

    document.getElementById("cart").innerHTML = output;
}

displayCart();

</script>

</body>
</html>
