<form id="form">
    Name:
    <input type="text" id="name" required>
    <br><br>

    <button type="submit">Submit</button>
</form>

<p id="success"></p>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
    e.preventDefault();

    document.getElementById("success").innerHTML =
        "Form submitted successfully!";
});
</script>
