<!DOCTYPE html>
<html>
<body>
<h2>Reverse a Number</h2>
<script>
    let num = Number(prompt("Enter a number:"));
    let temp = Math.abs(num);
    let reverse = 0;

    while (temp > 0) {
        let digit = temp % 10;
        reverse = reverse * 10 + digit;
        temp = Math.floor(temp / 10);
    }

    if (num < 0) reverse = -reverse;
    document.write("Reversed number: " + reverse);
</script>
</body>
</html>
