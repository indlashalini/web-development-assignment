<!DOCTYPE html>
<html>
<body>

<h2>Retrieve Username</h2>

<button onclick="displayUsername()">Display</button>
<p id="result"></p>

<script>
function displayUsername() {
    let username = localStorage.getItem("username");

    document.getElementById("result").innerHTML =
        "Username: " + username;
}
</script>

</body>
</html>
