<!DOCTYPE html>
<html>
<head>

<title>CRUD Application</title>

</head>

<body>

<h2>Student CRUD Application</h2>

<input type="text" id="name" placeholder="Student Name">
<input type="text" id="course" placeholder="Course">

<button onclick="addStudent()">Add Student</button>

<h3>Student Records</h3>

<table border="1" cellpadding="10">

<thead>
<tr>
    <th>Name</th>
    <th>Course</th>
    <th>Actions</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

<script>

let students =
    JSON.parse(localStorage.getItem("students")) || [];


// CREATE
function addStudent() {

    let name =
        document.getElementById("name").value;

    let course =
        document.getElementById("course").value;

    if (name === "" || course === "") {
        alert("Please enter all details");
        return;
    }

    let student = {
        name: name,
        course: course
    };

    students.push(student);

    saveData();

    document.getElementById("name").value = "";
    document.getElementById("course").value = "";

    displayStudents();
}


// SAVE
function saveData() {

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );
}


// READ
function displayStudents() {

    let table =
        document.getElementById("tableBody");

    table.innerHTML = "";

    students.forEach(function(student, index) {

        let row = `
        <tr>
            <td>${student.name}</td>
            <td>${student.course}</td>

            <td>
                <button onclick="editStudent(${index})">
                    Edit
                </button>

                <button onclick="deleteStudent(${index})">
                    Delete
                </button>
            </td>
        </tr>
        `;

        table.innerHTML += row;
    });
}


// UPDATE
function editStudent(index) {

    let newName =
        prompt("Enter new name:", students[index].name);

    let newCourse =
        prompt("Enter new course:", students[index].course);

    if (newName !== null && newCourse !== null) {

        students[index].name = newName;
        students[index].course = newCourse;

        saveData();

        displayStudents();
    }
}


// DELETE
function deleteStudent(index) {

    if (confirm("Are you sure you want to delete?")) {

        students.splice(index, 1);

        saveData();

        displayStudents();
    }
}


// Display records when page loads
displayStudents();

</script>

</body>
</html>
