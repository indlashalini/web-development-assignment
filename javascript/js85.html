<!DOCTYPE html>
<html>
<head>
    <title>Form Events</title>
</head>
<body>

<h2>Form Events Demonstration</h2>

<form id="myForm">
    <label>Name:</label>
    <input type="text" id="name">

    <br><br>

    <label>Choose Course:</label>
    <select id="course">
        <option value="">Select</option>
        <option value="Data Science">Data Science</option>
        <option value="Cyber Security">Cyber Security</option>
    </select>

    <br><br>

    <button type="submit">Submit</button>
</form>

<p id="output"></p>

<script>
const form = document.getElementById("myForm");
const nameInput = document.getElementById("name");
const course = document.getElementById("course");
const output = document.getElementById("output");

nameInput.addEventListener("focus", function() {
    output.textContent = "Name field focused.";
});

nameInput.addEventListener("blur", function() {
    output.textContent = "Name field lost focus.";
});

course.addEventListener("change", function() {
    output.textContent = "Selected course: " + course.value;
});

form.addEventListener("submit", function(event) {
    event.preventDefault();
    output.textContent = "Form submitted successfully!";
});
</script>

</body>
</html>
