<!DOCTYPE html>
<html>
<body>
    <p id="para">This is a paragraph.</p>

    <button onclick="hideText()">Hide</button>
    <button onclick="showText()">Show</button>

    <script>
        function hideText() {
            document.getElementById("para").style.display = "none";
        }

        function showText() {
            document.getElementById("para").style.display = "block";
        }
    </script>
</body>
</html>
